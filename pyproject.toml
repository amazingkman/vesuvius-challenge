[project]
name = "vesuvius-challenge"
version = "0.1.0"
description = "Independent tools for the Vesuvius Challenge"
readme = "README.md"
authors = [
    { name = "amazingkman", email = "kev.couch@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "humanize>=4.16.0",
    "imagecodecs>=2026.10.10",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "tifffile>=2026.10.15",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
    "vesuvius[volume-only]",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.scripts]
vch = "vesuvius_challenge.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
vesuvius = { git = "https://github.com/ScrollPrize/villa", subdirectory = "vesuvius", rev = "d57c28ebee8776b618f9851c2289cc407ea99dd4" }

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pyinstrument>=5.1.3",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
