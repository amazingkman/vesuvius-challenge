# Hooks are pinned by commit SHA, with the tag beside it (docs/security.md R4, DR-010).
# Install with: uv run pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: identity-scan
        name: identity and path scan (R2)
        entry: uv run --no-project python -I src/vesuvius_challenge/security.py identity
        language: system
        pass_filenames: false
        always_run: true
      - id: figure-register
        name: images must be listed in FIGURES.md (R3)
        entry: uv run --no-project python -I src/vesuvius_challenge/security.py figures
        language: system
        pass_filenames: false
        always_run: true
